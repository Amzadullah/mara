<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Products</title>
</head>
<body class="container mt-5">
    <h2>Product Inventory</h2>
    <a th:href="@{/products/add}" class="btn btn-success mb-3">Add New</a>
    <table class="table table-striped">
        <thead class="table-dark">
            <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
        </thead>
        <tbody>
            <tr th:each="p : ${productList}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price}"></td>
                <td th:text="${p.quantity}"></td>
                <td>
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{/products/delete/{id}(id=${p.id})}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
